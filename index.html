<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#121212" />
    <title>VibecodedPiano</title>
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/components.css" />
  </head>
  <body>
    <main id="app">
      <section id="view-library" class="view" hidden>
        <h1>Bibliothèque</h1>
        <!-- Test manuel P1 : import PDF direct, sans base. Remplacé par la vraie
             bibliothèque (IndexedDB) en P4 — voir plan.md §7. -->
        <div class="pdf-toolbar">
          <input type="file" id="pdf-file-input" accept="application/pdf" />
          <button type="button" id="pdf-zoom-out" aria-label="Zoom -">−</button>
          <button type="button" id="pdf-zoom-in" aria-label="Zoom +">+</button>
        </div>
        <div id="pdf-container" class="pdf-container"></div>
      </section>

      <section id="view-editor" class="view" hidden>
        <h1>Éditeur d'ancrages</h1>
      </section>

      <section id="view-play" class="view" hidden>
        <h1>Mode jeu</h1>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
