name: Deploy to GitHub Pages

# Ne se déclenche que sur main : l'environnement "github-pages" (créé automatiquement par
# GitHub quand Pages est activé) restreint le déploiement à la branche par défaut. Un push sur
# une autre branche construit et échoue silencieusement au job "deploy" (voir historique Actions).
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Prévisualisation temporaire de la refonte UI (branche claude/gui-reprise-6pyhz3),
      # déployée à côté du site principal sous /VibecodedPiano/nouvelle-ui/ dans le même
      # artefact Pages (voir le lien "Essayer la nouvelle interface" dans index.html). PWA
      # désactivée sur ce build (VITE_DISABLE_PWA) : un service worker de plus, avec un scope
      # imbriqué sous celui du site principal, se disputerait le contrôle des pages avec lui.
      # Best-effort à chaque étape (continue-on-error) : si cette branche disparaît ou casse, le
      # site principal se déploie quand même seul plutôt que de faire échouer tout le job.
      - name: Checkout preview UI branch
        id: checkout-preview
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: claude/gui-reprise-6pyhz3
          path: preview-src

      - name: Install preview UI deps
        if: steps.checkout-preview.outcome == 'success'
        id: install-preview
        continue-on-error: true
        working-directory: preview-src
        run: npm ci

      - name: Build preview UI
        if: steps.install-preview.outcome == 'success'
        id: build-preview
        continue-on-error: true
        working-directory: preview-src
        env:
          VITE_DEPLOY_BASE: /VibecodedPiano/nouvelle-ui/
          VITE_DISABLE_PWA: 'true'
        run: npm run build

      - name: Merge preview UI into site artifact
        if: steps.build-preview.outcome == 'success'
        run: cp -r preview-src/dist dist/nouvelle-ui

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
